[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Oma-Sijoitus-AI – henkilökohtainen AI-sijoitusassistentti"
requires-python = ">=3.10"
dependencies = [
    "apscheduler==3.11.3",
    "feedparser==6.0.12",
    "flask==3.0.3",
    "gunicorn==23.0.0",
    "openai==2.48.0",
    "python-binance==1.0.37",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "vadersentiment==3.3.2",
    "werkzeug==3.1.8",
]
