# ja peilaa se sen jälkeen tähän.
#
# requires-python on laskettu 3.13 -> 3.10, jotta sovellus asentuu
# Ubuntu LTS -oletustulkeilla (22.04 = 3.10, 24.04 = 3.12). Aiemman
