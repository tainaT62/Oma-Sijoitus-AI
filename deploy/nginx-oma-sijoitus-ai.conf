# Nginx-kokoonpano: Oma-Sijoitus-AI
#
# Asennus:
#   sudo cp deploy/nginx-oma-sijoitus-ai.conf /etc/nginx/sites-available/oma-sijoitus-ai
#   sudo ln -s /etc/nginx/sites-available/oma-sijoitus-ai /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# KORVAA sijoitus.esimerkki.fi omalla verkkotunnuksellasi (2 kohtaa).
# Varmenteet haetaan certbotilla, ks. deploy/README.md.

# ─── Kirjautumisen nopeusrajoitus ────────────────────────────
# Toinen kerros sovelluksen oman rajoituksen rinnalle. Pysäyttää
# hyökkäyksen jo ennen Pythonia (jokainen yritys maksaa
# salasanatiivisteen laskennan verran CPU:ta).
# Kuuluu http-lohkoon; jos nginx.conf ei salli tätä täällä, siirrä rivi
# tiedostoon /etc/nginx/nginx.conf http { } -lohkoon.
limit_req_zone $binary_remote_addr zone=kirjautuminen:10m rate=12r/m;

# ─── HTTP: ohjaa HTTPS:ään ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sijoitus.esimerkki.fi;

    # Certbotin HTTP-01-haaste on ainoa asia, joka tarjoillaan HTTP:llä.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sijoitus.esimerkki.fi;

    # ─── Varmenteet (certbot täyttää nämä polut) ─────────────
    ssl_certificate     /etc/letsencrypt/live/sijoitus.esimerkki.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sijoitus.esimerkki.fi/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sijoitus.esimerkki.fi/chain.pem;

    # ─── TLS-asetukset ───────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Otsakkeet ───────────────────────────────────────────
    # HSTS asetetaan VAIN täällä, ei sovelluksessa: sovellus ei tiedä
    # onko TLS päällä. Aloita pienellä max-agella ja kasvata vasta kun
    # olet varma, ettet palaa HTTP:hen.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Sovellus asettaa omat turvaotsakkeensa; nämä ovat varmistus siltä
    # varalta, että jokin vastaus ohittaa sovelluksen (esim. nginxin
    # oma virhesivu).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Yksityinen järjestelmä – ei hakukoneisiin.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Ei paljasteta nginxin versiota.
    server_tokens off;

    # Vastaa sovelluksen MAX_CONTENT_LENGTH-rajaa (1 MB).
    client_max_body_size 1m;

    # ─── Kirjautuminen: tiukempi rajoitus ────────────────────
    location = /kirjaudu {
        limit_req zone=kirjautuminen burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ─── Sovellus ────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5000;

        # Alkuperäinen asiakastieto sovellukselle. Nginx YLIKIRJOITTAA
        # X-Forwarded-For -otsakkeen ($proxy_add_x_forwarded_for lisää
        # todellisen $remote_addr:n), joten asiakas ei voi väärentää sitä.
        # Sovelluksessa on oltava TRUSTED_PROXY_COUNT=1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # /api/dashboard voi kestää kymmeniä sekunteja kylmällä
        # välimuistilla. Nämä on pidettävä Gunicornin timeoutia (120 s)
        # suurempina, jotta nginx ei katkaise pyyntöä ensin.
        proxy_connect_timeout 10s;
        proxy_send_timeout    150s;
        proxy_read_timeout    150s;

        # Analyysivastaukset ovat pitkiä; ei puskuroida levylle.
        proxy_buffering off;
    }
}
