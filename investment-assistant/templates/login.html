<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kirjaudu – AI-sijoitusassistentti</title>
  <style>
    :root {
      --bg: #0b1220; --card: #111a2e; --border: #1e2d4a;
      --text: #e6edf7; --muted: #7f8ea8; --accent: #3b82f6; --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .kortti {
      width: 100%; max-width: 380px; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 32px 28px;
    }
    .logo { font-size: 1.6rem; margin-bottom: 4px; }
    h1 { font-size: 1.15rem; margin: 0 0 4px; font-weight: 700; }
    .alaotsikko { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 11px 13px; border-radius: 8px;
      border: 1px solid var(--border); background: #0d1526;
      color: var(--text); font-size: 0.95rem;
    }
    input[type=password]:focus {
      outline: none; border-color: var(--accent);
    }
    button {
      width: 100%; margin-top: 18px; padding: 11px;
      border: none; border-radius: 8px; background: var(--accent);
      color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2f6fd0; }
    .virhe {
      margin-bottom: 16px; padding: 10px 12px; border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; font-size: 0.85rem;
    }
    .huomio {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 0.75rem; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="kortti">
    <div class="logo">📊</div>
    <h1>AI-sijoitusassistentti</h1>
    <div class="alaotsikko">Henkilökohtainen analyysijärjestelmä</div>

    {% if virhe %}
      <div class="virhe">{{ virhe }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('kirjaudu', seuraava=seuraava) }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label for="salasana">Salasana</label>
      <input type="password" id="salasana" name="salasana"
             autocomplete="current-password" required autofocus />
      <button type="submit">Kirjaudu sisään</button>
    </form>

    <div class="huomio">
      Yksityinen järjestelmä. Kaikki kirjautumisyritykset kirjataan lokiin.
    </div>
  </div>
</body>
</html>
